</head><body>
<div class="top" id="top" style="display:none"><div class="t"><span id="tt">Reportes</span><div class="s" id="ts"></div></div>
<button id="bInicio" onclick="ir('')" title="Inicio">⌂</button><button class="y" id="bAct" onclick="actualizar(true)">Actualizar</button><button onclick="salir()">Salir</button></div>
<nav class="side noprint" id="side"></nav><nav class="bnav noprint" id="bnav"></nav>
<div id="app"><div class="vac">Cargando…</div></div>
<div class="load" id="load"><div class="spin"></div><div id="loadT">Cargando…</div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
"use strict";
var CFG = window.CACHA_CONFIG || {};
var DB = null;            // {meta, cursos:{id:C}}
var USER = null, AUTH = null, FB = null, ultimoUso = Date.now();
var LS_D = 'cacha_web_datos_v1', LS_P = 'cacha_web_personal';
var EST = {OK:['Entregó','pb'],NE:['No entregó','pr'],INA:['Pendiente (inasistencia)','pa'],PEND:['Por entregar','pg'],SINCAL:['Sin calificar','pg'],OTRO:['Registrado','pg']};
var PEN = {PLAZO:['Aún en plazo','pa'],VENC:['Plazo vencido','pr'],INA:['Por inasistencia','pa'],CLASE:['No la presentó en clase','pr'],REC:['Ya la entregó','pv']};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
function t2(n){return n==null||n===''||isNaN(n)?null:Math.floor(Number(n)*100+1e-7)/100}
function f2(n){var t=t2(n);return t==null?'—':t.toFixed(2).replace('.',',')}
function fc(k){if(!k)return '';var p=String(k).split('-');return p.length===3?p[2]+'/'+p[1]:k}
function ord(n){return {1:'1.er',2:'2.º',3:'3.er'}[Number(n)]||n}
function min(){return (DB&&DB.meta&&DB.meta.notaMin)||7}
function cls(n){var t=t2(n);return t==null?'':(t<min()?'rojo':'')}
function toast(t,ms){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},ms||3200)}
function cargando(on,t){$('load').style.display=on?'flex':'none';if(t)$('loadT').textContent=t}
function personal(){try{return localStorage.getItem(LS_P)==='1'}catch(e){return false}}

/* ───────── inicio de sesión (Firebase Auth con la cuenta de Google del docente) ───────── */
function pantallaLogin(msg){
  $('top').style.display='none';document.body.classList.remove('in');
  $('app').innerHTML='<div class="login"><div class="card"><div style="font-size:34px">🔐</div><div style="font-size:18px;font-weight:bold;margin:6px 0 2px">Reportes · Sistema Docente</div>'+
  '<div class="muted" style="margin-bottom:16px">Acceso privado. Solo la cuenta autorizada del docente puede entrar.</div>'+
  (msg?'<div class="ban r">'+esc(msg)+'</div>':'')+
  '<button class="gbtn" onclick="entrar()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> Iniciar sesión con Google</button>'+
  '<label style="display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;font-size:13px;color:#3A4D6B"><input type="checkbox" id="esPersonal" '+(personal()?'checked':'')+'> Es mi dispositivo personal (mantener la sesión)</label>'+
  '<div class="muted" style="margin-top:8px">En una computadora compartida deje la casilla sin marcar: la sesión se cierra sola tras 30 minutos sin uso.</div></div></div>';
}
function cargarFirebase(){
  if(FB)return Promise.resolve(FB);
  var v='10.12.2';
  return Promise.all([import('https://www.gstatic.com/firebasejs/'+v+'/firebase-app.js'),import('https://www.gstatic.com/firebasejs/'+v+'/firebase-auth.js')]).then(function(m){
    var app=m[0].initializeApp({apiKey:CFG.apiKey,authDomain:CFG.authDomain,projectId:CFG.projectId,appId:CFG.appId});
    FB={A:m[1],auth:m[1].getAuth(app)};return FB});
}
function entrar(){
  try{localStorage.setItem(LS_P,$('esPersonal')&&$('esPersonal').checked?'1':'0')}catch(e){}
  cargando(true,'Abriendo Google…');
  cargarFirebase().then(function(F){
    return F.A.setPersistence(F.auth,personal()?F.A.browserLocalPersistence:F.A.browserSessionPersistence).then(function(){
      var p=new F.A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
      return F.A.signInWithPopup(F.auth,p)});
  }).then(function(){cargando(false)}).catch(function(e){cargando(false);
    var m=String(e&&e.code||e);
    if(/popup-closed|cancelled-popup/.test(m))return;
    if(/popup-blocked/.test(m))return pantallaLogin('El navegador bloqueó la ventana de Google. Permita las ventanas emergentes para esta página y vuelva a intentar.');
    if(/unauthorized-domain/.test(m))return pantallaLogin('Falta autorizar esta dirección en Firebase (Authentication › Configuración › Dominios autorizados).');
    pantallaLogin('No se pudo iniciar sesión ('+m+').')});
}
function salir(){
  try{localStorage.removeItem(LS_D)}catch(e){}
  DB=null;USER=null;
  if(FB)FB.A.signOut(FB.auth).then(function(){pantallaLogin()});else pantallaLogin();
}
function vigilarInactividad(){
  ['click','keydown','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,function(){ultimoUso=Date.now()},{passive:true})});
  setInterval(function(){if(USER&&!personal()&&Date.now()-ultimoUso>30*60000){salir();toast('Sesión cerrada por inactividad.',5000)}},60000);
}

/* ───────── datos: índice + resúmenes comprimidos (Firestore, solo lectura) ───────── */
function urlDocs(){return 'https://firestore.googleapis.com/v1/projects/'+CFG.projectId+'/databases/(default)/documents'}
function leerDocs(ids,token){
  var base='projects/'+CFG.projectId+'/databases/(default)/documents/d/';
  return fetch(urlDocs()+':batchGet',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    body:JSON.stringify({documents:ids.map(function(i){return base+i})})}).then(function(r){
      if(r.status===403)throw new Error('SIN_PERMISO');if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(arr){
      var o={};arr.forEach(function(x){if(x.found){var id=x.found.name.split('/').pop(),f=x.found.fields||{};o[id]={};Object.keys(f).forEach(function(k){o[id][k]=f[k].stringValue!=null?f[k].stringValue:(f[k].integerValue!=null?Number(f[k].integerValue):null)})}});return o});
}
function gunzip64(b64){
  var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  if(typeof DecompressionStream==='undefined')return Promise.reject(new Error('Este navegador es muy antiguo. Actualice Chrome o Safari.'));
  var s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(s).text().then(function(t){return JSON.parse(t)});
}
var KIT=null,KITH='';
function kitCompilar(txt,h){try{KIT=(new Function(txt))();KITH=h;try{localStorage.setItem('cacha_kit_h',h);localStorage.setItem('cacha_kit',txt)}catch(e){}}catch(e){KIT=null;console.error('kit',e)}}
function kitDeCache(h){if(KIT&&KITH===h)return true;try{if(localStorage.getItem('cacha_kit_h')===h){kitCompilar(localStorage.getItem('cacha_kit'),h);return !!KIT}}catch(e){}return false}
function descargar(){
  if(CFG.demo)return fetch(CFG.demo).then(function(r){return r.json()}).then(function(d){if(d.kit&&!KIT)kitCompilar(d.kit,'demo');return d});
  return USER.getIdToken().then(function(tok){
    return leerDocs(['meta'],tok).then(function(m){
      if(!m.meta)throw new Error('SIN_DATOS');
      var meta=JSON.parse(m.meta.j),ids=[],kit=meta.kit,pideKit=kit&&!kitDeCache(kit.h);
      meta.cursos.forEach(function(c){for(var i=0;i<c.p;i++)ids.push(c.id+'-'+i)});
      if(pideKit)for(var k=0;k<kit.p;k++)ids.push('kit-'+k);
      var gl=meta.glob;if(gl)for(var g=0;g<gl.p;g++)ids.push('glob-'+g);
      return (ids.length?leerDocs(ids,tok):Promise.resolve({})).then(function(D){
        var ps=meta.cursos.map(function(c){var z='';for(var i=0;i<c.p;i++){if(!D[c.id+'-'+i])return Promise.resolve(null);z+=D[c.id+'-'+i].z}return gunzip64(z)});
        if(pideKit){var zk='',okk=true;for(var k=0;k<kit.p;k++){if(!D['kit-'+k]){okk=false;break}zk+=D['kit-'+k].z}
          if(okk)ps.push(gunzip64(zk).then(function(txt){kitCompilar(txt,kit.h);return null}))}
        var pglob=Promise.resolve(null);if(gl){var zg='',okg=true;for(var g=0;g<gl.p;g++){if(!D['glob-'+g]){okg=false;break}zg+=D['glob-'+g].z}if(okg)pglob=gunzip64(zg)}

    USER.getIdToken().then(function(tok){

/* ═════════ 🧾 CALIFICAR CON RÚBRICA ═════════ */
var RB={cid:null,ai:0,t:1,j:null,rid:null,i:null,niv:[],np:false,ina:false,atr:false,obs:''};
function rbCal(C,ai,t,j){var A=C.rp.as[ai];return ((C.rb&&C.rb.cal)||[]).filter(function(r){return norm(r.asig)===norm(A.a)&&String(r.trim)===String(t)&&String(r.j)===String(j)})}
function rbBib(C,ai){var G=DB.glob&&DB.glob.rub;if(!G)return [];var A=C.rp.as[ai],sub=KIT.subnivelDe_(C.c);return (G.bib||[]).filter(function(x){return !x.oculta&&KIT.rubAplica_(x.def,A.a,sub)}).map(function(x){return x.def})}
function rbDef(C,ai){var cal=rbCal(C,RB.ai,RB.t,RB.j),G=DB.glob.rub,bib=rbBib(C,ai);
  if(cal.length&&!RB.cambio){var d=G.defs[cal[0].cod];if(d){d=JSON.parse(JSON.stringify(d));d.id=cal[0].rid;return d}}
  return bib.filter(function(d){return d.id===RB.rid})[0]||bib[0]||null}
function verRubrica(){
  if(!necesitaKit())return;
  if(!(DB.glob&&DB.glob.rub)){$('app').innerHTML='<div class="wrap"><div class="card vac">Falta actualizar los datos (en su sistema: «📤 Enviar todos mis cursos»).</div></div>';return}
  var L=cursoAsigs();if(!L.length)return inicio();
  if(!RB.cid||!DB.cursos[RB.cid]){RB.cid=L[0].cid;RB.ai=L[0].ai;RB.t=trimAct(DB.cursos[RB.cid])}
  var C=DB.cursos[RB.cid],cols=colsDe(C,RB.ai,RB.t,false).filter(function(c){return c.comp!=='Refuerzo'});$('tt').textContent='🧾 Calificar con rúbrica';
  if(RB.j==null||!cols.some(function(c){return c.j===RB.j}))RB.j=cols.length?cols[0].j:null;
  var def=RB.j!=null?rbDef(C,RB.ai):null,cal=RB.j!=null?rbCal(C,RB.ai,RB.t,RB.j):[],bib=rbBib(C,RB.ai);if(def)RB.rid=def.id;
  var h='<div class="wrap"><div class="muted noprint" style="margin-bottom:6px"><a href="#">← Inicio</a></div><div class="card">'+selCursoAsig('rbCA',RB.cid,RB.ai,"rbCambiar(this.value)")+segTrim(RB.t,'rbTrim')+
    (cols.length?'<div class="h" style="margin-top:10px">Actividad (casillero del cuadro)</div><select onchange="RB.j=Number(this.value);RB.cambio=false;verRubrica()">'+cols.map(function(c){return '<option value="'+c.j+'"'+(RB.j===c.j?' selected':'')+'>'+esc(c.et)+'</option>'}).join('')+'</select>':'')+
    '<div class="h" style="margin-top:10px">Rúbrica</div><select onchange="RB.rid=this.value;RB.cambio=true;verRubrica()">'+bib.map(function(d){return '<option value="'+esc(d.id)+'"'+(def&&d.id===def.id?' selected':'')+'>'+esc((d.ic||'📋')+' '+d.t)+'</option>'}).join('')+(def&&!bib.some(function(d){return d.id===def.id})?'<option selected>'+esc(def.t)+'</option>':'')+'</select>'+
    (cal.length&&RB.cambio&&def&&def.id!==cal[0].rid?'<div class="ban a" style="margin-top:6px">Esta actividad ya se calificó con «'+esc(cal[0].rubrica)+'». Si guarda con otra rúbrica, su sistema la cambiará para toda la actividad.</div>':'')+'</div>';
  var pend={};COLA.forEach(function(o){var q=o.op&&o.op.o;if(o.k==='rub'&&o.est==='PEND'&&q&&q.curso===C.c&&q.asig===C.rp.as[RB.ai].a&&Number(q.j)===RB.j&&Number(q.trim)===RB.t)q.items.forEach(function(it){pend[norm(it.n)]=it})});
  var por={};cal.forEach(function(r){por[norm(r.est)]=r});var x=mjQ(C,RB.ai,RB.t);
  h+='<div class="card"><div class="h">Estudiantes · '+cal.length+' calificado(s)</div>'+C.e.map(function(E,i){if(!x||!mjFila(C,E,RB.ai,x.qi))return '';var r=por[norm(E.n)],p=pend[norm(E.n)];
    return '<div class="li" onclick="rbAbrir('+i+')"><div class="x"><b>'+esc(E.n)+'</b><small>'+(p?'<span style="color:#8A5A00">por guardar</span>':r?(r.reg?'en el registro':'borrador (falta pasar al registro)'):'sin calificar')+'</small></div>'+(r&&!p?'<span class="nota '+cls(KIT.num_(r.nota))+'">'+(r.nota==='INA'?'INA':f2(KIT.num_(r.nota)))+'</span>':'')+'</div>'}).join('')+'</div>';
  h+='<div class="acts"><button class="btn bp" onclick="rbPasarVer()">📥 Pasar al registro</button></div><div id="rbP"></div><div id="colaBox"></div></div>';
  $('app').innerHTML=h;pintarCola();
}
function rbCambiar(v){var p=v.split('|');RB.cid=p[0];RB.ai=Number(p[1]);RB.j=null;RB.cambio=false;verRubrica()}
function rbTrim(t){RB.t=t;RB.j=null;RB.cambio=false;verRubrica()}
function rbAbrir(i){var C=DB.cursos[RB.cid],def=rbDef(C,RB.ai);if(!def){toast('No hay rúbricas para esta asignatura.');return}
  var r=rbCal(C,RB.ai,RB.t,RB.j).filter(function(x){return norm(x.est)===norm(C.e[i].n)})[0];
  RB.i=i;RB.niv=r&&r.cod&&DB.glob.rub.defs[r.cod]&&!RB.cambio?KIT.rubNivDe_(def,r.niv):def.c.map(function(){return null});RB.np=!!(r&&r.niv==='NO PRESENTÓ');RB.ina=!!(r&&r.niv==='INASISTENCIA');RB.atr=!!(r&&r.atr);RB.obs=r?r.obs||'':'';rbPintar()}
function rbPintar(){
  var C=DB.cursos[RB.cid],def=rbDef(C,RB.ai),E=C.e[RB.i],sobre=DB.glob.rub.sobre,NV=KIT.RUB_NIV_;
  $('tt').textContent='🧾 '+E.n;
  var h='<div class="wrap"><div class="muted noprint" style="margin-bottom:6px"><a href="javascript:void(0)" onclick="verRubrica()">← Lista</a></div><div class="card"><b>'+esc(E.n)+'</b><div class="muted">'+esc(def.t)+'</div></div>';
  h+='<div class="card">'+def.c.map(function(c,k){var bt=c.b?[[0,'Cumple'],[3,'No cumple']]:[[0,NV[0].t],[1,NV[1].t],[2,NV[2].t],[3,NV[3].t],[4,'Sin evidencia']];
    var sel=RB.niv[k];return '<div style="padding:8px 0;border-bottom:1px solid #EEF1F6"><b>'+(k+1)+'. '+esc(c.t)+'</b> <span class="muted">('+f2(c.p)+' pts)</span>'+(c.s?'<div class="muted">'+esc(c.s)+'</div>':'')+
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:5px">'+bt.map(function(b){var on=sel===b[0];var cc=b[0]===4?'#5B6B85':(NV[b[0]]||NV[3]).c;return '<button class="btn" style="flex:1;min-width:70px;padding:7px 4px;font-size:12px;border:1.5px solid '+(on?cc:'#D3DEF2')+';background:'+(on?cc:'#fff')+';color:'+(on?'#fff':'#3A4D6B')+'" onclick="RB.niv['+k+']='+b[0]+';rbPintar()">'+esc(b[1])+'</button>'}).join('')+'</div>'+
      (sel!=null&&sel<4&&c.d&&c.d[sel]?'<div class="muted" style="margin-top:4px">'+esc(c.d[sel])+'</div>':'')+'</div>'}).join('')+
    '<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" '+(RB.np?'checked':'')+' onchange="RB.np=this.checked;if(RB.np)RB.ina=false;rbPintar()"> No presentó</label>'+
    '<label style="display:flex;gap:8px;align-items:center;margin-top:4px"><input type="checkbox" '+(RB.ina?'checked':'')+' onchange="RB.ina=this.checked;if(RB.ina)RB.np=false;rbPintar()"> Faltó (pendiente por inasistencia)</label>'+
    '<label style="display:flex;gap:8px;align-items:center;margin-top:4px"><input type="checkbox" '+(RB.atr?'checked':'')+' onchange="RB.atr=this.checked;rbPintar()"> Entrega atrasada (sobre '+String(sobre).replace('.',',')+')</label>'+
    '<div class="h" style="margin-top:8px">Observación (opcional)</div><input type="text" value="'+esc(RB.obs)+'" oninput="RB.obs=this.value" style="width:100%;padding:9px;border:1px solid #C9D8F2;border-radius:10px"></div>';
  var r=RB.ina?{nota:'INA'}:KIT.rubCalc_(def,RB.niv,RB.np,RB.atr,sobre);
  h+='<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Nota calculada</span><b style="font-size:24px" class="'+(r.incompleto?'':cls(r.nota))+'">'+(r.incompleto?'Faltan '+r.faltan+' criterio(s)':r.nota==='INA'?'INA':f2(r.nota))+'</b></div>';
  h+='<div class="acts"><button class="btn bp" '+(r.incompleto?'disabled style="opacity:.5"':'')+' onclick="rbGuardar()">💾 Guardar y siguiente →</button></div><div id="colaBox"></div></div>';
  $('app').innerHTML=h;pintarCola();
}
function rbGuardar(){var C=DB.cursos[RB.cid],def=rbDef(C,RB.ai),E=C.e[RB.i],cal=rbCal(C,RB.ai,RB.t,RB.j);
  var r=RB.ina?{nota:'INA'}:KIT.rubCalc_(def,RB.niv,RB.np,RB.atr,DB.glob.rub.sobre);if(r.incompleto)return;
  var col=(colsDe(C,RB.ai,RB.t,false).filter(function(c){return c.j===RB.j})[0]||{}).et||'';
  var op={k:'rub',o:{curso:C.c,asig:C.rp.as[RB.ai].a,trim:RB.t,j:RB.j,def:def,cambiar:!!(cal.length&&cal[0].rid!==def.id),items:[{n:E.n,niv:RB.niv,np:RB.np,ina:RB.ina,atr:RB.atr,obs:RB.obs}]}};
  encolar(op,'Rúbrica · '+E.n+' · '+(r.nota==='INA'?'INA':f2(r.nota)),C.c).then(function(){var x=mjQ(C,RB.ai,RB.t),sig=null;for(var i=RB.i+1;i<C.e.length;i++)if(x&&mjFila(C,C.e[i],RB.ai,x.qi)){sig=i;break}if(sig!=null)rbAbrir(sig);else verRubrica()}).catch(function(e){toast('❌ '+(e.message||e),8000)})}
function rbPasarVer(){var C=DB.cursos[RB.cid];if(RB.j==null)return;
  if(COLA.some(function(o){return o.k==='rub'&&o.est==='PEND'&&o.op.o&&o.op.o.curso===C.c})){toast('Hay calificaciones con rúbrica por aplicar. Pulse «🔄 Actualizar ahora» en el curso o espere unos minutos, y vuelva a intentar.',8000);return}
  var P=rbPrevia(KIT,C,RB.ai,RB.t,RB.j,rbCal(C,RB.ai,RB.t,RB.j));
  if(!P.items.length){$('rbP').innerHTML='<div class="card vac">No hay calificaciones con rúbrica en esta actividad.</div>';return}
  var t={NUEVA:['Nueva','pv'],IGUAL:['Ya está igual','pg'],MARCA:['Reemplaza NE/INA','pa'],YA:['Ya tenía otra nota','pr']};
  $('rbP').innerHTML='<div class="card"><div class="h">Revisión antes de pasar al registro</div>'+P.items.map(function(x,k){return '<div class="li" style="cursor:default"><div class="x"><b>'+esc(x.n)+'</b><small>'+(x.antes!==''?'En el cuadro: '+esc(valTxt(x.antes))+' · ':'')+'Rúbrica: '+(x.nota==='INA'?'INA':f2(KIT.num_(x.nota)))+'</small></div><span class="pill '+t[x.estado][1]+'">'+t[x.estado][0]+'</span>'+(x.estado==='YA'?'<label style="margin-left:6px;font-size:12px"><input type="checkbox" class="rbRep" value="'+esc(x.n)+'"> reemplazar</label>':'')+'</div>'}).join('')+
    (P.sin.length?'<div class="muted" style="margin-top:6px">Sin calificar con rúbrica: '+P.sin.length+'</div>':'')+'<button class="btn bp" style="width:100%;margin-top:8px" onclick="rbPasar()">📥 Pasar al registro</button></div>'}
function rbPasar(){var C=DB.cursos[RB.cid],rep=[].map.call(document.querySelectorAll('.rbRep:checked'),function(x){return x.value});
  encolar({k:'rub_pasar',o:{curso:C.c,asig:C.rp.as[RB.ai].a,trim:RB.t,j:RB.j,reemplazar:rep}},'Pasar rúbricas al registro',C.c).then(function(){$('rbP').innerHTML=''}).catch(function(e){toast('❌ '+(e.message||e),8000)})}

/* ───────── arranque ───────── */
function arrancar(){
  vigilarInactividad();
  if(CFG.demo){USER={demo:true};colaCargar();$('app').innerHTML='';actualizar(false);return}
  if(!CFG.apiKey){$('app').innerHTML='<div class="wrap"><div class="card vac">Falta el archivo <b>config.js</b>. Descárguelo desde su sistema (🌐 Página web rápida › paso 6) y súbalo junto a esta página.</div></div>';return}
  var c=leerCache();
  if(c){DB=c;encabezado();ruta()}   // se ve al instante con lo último guardado; luego se actualiza
  else $('app').innerHTML='<div class="vac">Cargando…</div>';
  cargarFirebase().then(function(F){
    F.A.onAuthStateChanged(F.auth,function(u){
      if(!u){DB=null;try{localStorage.removeItem(LS_D)}catch(e){}pantallaLogin();return}
      if(CFG.docente&&String(u.email||'').toLowerCase()!==String(CFG.docente).toLowerCase()){
        F.A.signOut(F.auth);pantallaLogin('La cuenta '+u.email+' no está autorizada. Entre con '+CFG.docente+'.');return}
      USER=u;ultimoUso=Date.now();colaCargar();actualizar(false).then(function(){vigilarCola()});
    });
  }).catch(function(){if(!DB)$('app').innerHTML='<div class="wrap"><div class="card vac">No se pudo cargar el inicio de sesión. Revise su internet.</div></div>'});
}
arrancar();
</script>
</body></html>
